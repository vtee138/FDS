services:
  postgres:
    image: postgres:16-alpine
    container_name: fds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fds
      POSTGRES_PASSWORD: fds_password
      POSTGRES_DB: fds_db
    ports:
      - "5433:5432"
    volumes:
      - fds_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fds -d fds_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    container_name: fds-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://fds:fds_password@postgres:5432/fds_db?schema=public
      FRONTEND_ORIGIN: http://localhost:3000
      ADMIN_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/src/main.js"

  frontend:
    build:
      context: ./frontend
    container_name: fds-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

  admin:
    build:
      context: ./admin
    container_name: fds-admin
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:80"

volumes:
  fds_postgres_data:
